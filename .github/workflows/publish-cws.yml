name: Publish Chrome Web Store

on:
  workflow_dispatch:
    inputs:
      publish_live:
        description: Also submit for review/publication after upload
        type: boolean
        required: false
        default: false
      release_tag:
        description: GitHub Release tag holding the locked ZIP (e.g. v0.2.1-candidate)
        type: string
        required: true
      asset_name:
        description: Release asset filename
        type: string
        required: false
        default: covelet-0.2.1.zip

permissions:
  contents: read

concurrency:
  group: chrome-web-store-publish
  cancel-in-progress: false

jobs:
  publish-chrome-web-store:
    name: publish-chrome-web-store
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: chrome-web-store
    defaults:
      run:
        shell: bash
    env:
      EXTENSION_ID: clkholbmabommppnlpcnhdgmibibblgb
    steps:
      - name: Check required secrets
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          set -euo pipefail
          missing=0
          for secret_name in CWS_SERVICE_ACCOUNT_JSON CWS_PUBLISHER_ID; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Missing required secret: ${secret_name}"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Download and verify locked ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_TAG" ]]; then
            echo '::error::release_tag is required.'
            exit 1
          fi
          case "$ASSET_NAME" in
            ''|.|..|*/*|*\\*|*'*'*|*'?'*|*'['*|*']'*)
              echo '::error::asset_name must be an exact filename without paths or glob patterns.'
              exit 1
              ;;
          esac
          cd "$GITHUB_WORKSPACE"
          if ! gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET_NAME" --dir "$GITHUB_WORKSPACE"; then
            echo "::error::Unable to download asset '${ASSET_NAME}' from Release tag '${RELEASE_TAG}'. Check that the Release/tag and asset exist and are accessible."
            exit 1
          fi
          if [[ ! -f "$ASSET_NAME" ]]; then
            echo "::error::Release asset '${ASSET_NAME}' was not downloaded."
            exit 1
          fi
          expected_sha='bd2e26cb50a5bd3b1183677fdd89275b9499b774a25624f6a4d5c26a85d860dd'
          actual_sha="$(sha256sum -- "$ASSET_NAME" | cut -d ' ' -f 1)"
          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo "::error::Locked ZIP SHA256 mismatch: expected ${expected_sha}, got ${actual_sha}. Upload blocked."
            exit 1
          fi
          echo "Locked ZIP SHA256 verified: ${actual_sha}"
          if [[ "$ASSET_NAME" != covelet-0.2.1.zip ]]; then
            mv -- "$ASSET_NAME" covelet-0.2.1.zip
          fi

      - name: Authenticate with service account
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
          export_environment_variables: false

      - name: Upload draft package
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          set -euo pipefail
          response_file="${RUNNER_TEMP}/cws-upload-response.json"
          if ! status=$(curl --silent --show-error --request POST \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            --header 'Content-Type: application/zip' \
            --data-binary "@${GITHUB_WORKSPACE}/covelet-0.2.1.zip" \
            --output "$response_file" --write-out '%{http_code}' \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/${CWS_PUBLISHER_ID}/items/${EXTENSION_ID}:upload"); then
            echo '::error::Chrome Web Store upload transport failure.'
            cat "$response_file" 2>/dev/null || true
            exit 1
          fi
          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Chrome Web Store upload failed (HTTP ${status})."
            cat "$response_file"
            exit 1
          fi
          cat "$response_file"
          # A 2xx can still report processing or validation failure. Do not submit it.
          if ! jq -e '.uploadState == "SUCCEEDED"' "$response_file" >/dev/null; then
            echo '::error::Upload is not in SUCCEEDED state. Inspect the response/dashboard before any submission.'
            exit 1
          fi

      - name: Submit for review and publication
        if: ${{ inputs.publish_live == true }}
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          set -euo pipefail
          response_file="${RUNNER_TEMP}/cws-publish-response.json"
          if ! status=$(curl --silent --show-error --request POST \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            --output "$response_file" --write-out '%{http_code}' \
            "https://chromewebstore.googleapis.com/v2/publishers/${CWS_PUBLISHER_ID}/items/${EXTENSION_ID}:publish"); then
            echo '::error::Chrome Web Store publish transport failure.'
            cat "$response_file" 2>/dev/null || true
            exit 1
          fi
          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Chrome Web Store publish failed (HTTP ${status})."
            cat "$response_file"
            exit 1
          fi
          cat "$response_file"
